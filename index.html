<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>АвтоЖурнал</title>
<meta name="theme-color" content="#0f7b5f">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="АвтоЖурнал">

<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#eef1ef;--card:#fff;--tx:#1c2421;--mu:#68746f;--ac:#0f7b5f;--ac2:#e8f3ef;--ln:#dde3e0;--dg:#c0392b;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#121715;--card:#1c2421;--tx:#e8eeeb;--mu:#93a19b;--ac:#35c29a;--ac2:#1f3a32;--ln:#2c3733;--dg:#ef6f60;--on:#07241b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;height:100%}
#col{height:100%;display:flex;flex-direction:column}
header{background:var(--ac);color:var(--on);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;font-size:20px;font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:10px}
header select{width:auto;max-width:55%;background:rgba(255,255,255,.2);color:var(--on);border:0;font-size:15px;font-weight:600;padding:8px 10px}
header select option{color:#1c2421}
main{flex:1;overflow-y:auto;padding:12px 12px 90px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--ln)}
.hero{background:var(--ac);color:var(--on);border:0}
.hero b{font-size:40px;font-weight:700;letter-spacing:-.02em}.hero span{font-size:15px;opacity:.9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .card{margin:0}.k{color:var(--mu);font-size:13px}.v{font-size:21px;font-weight:650}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.row:last-child{border:0}.row .r{text-align:right;white-space:nowrap}.sub{color:var(--mu);font-size:13px}
.pill{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .brand{display:none}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0 8px;font:inherit;font-size:12px;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:20px}
nav button.on{color:var(--ac);font-weight:650}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:var(--on);font-size:30px;box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer;z-index:4}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
.sheet h3{margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
input[type=checkbox]{width:auto;margin-right:8px}
.chk{display:flex;align-items:center;margin-top:12px}
.btns{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:10px;border:0;background:var(--ac);color:var(--on);font:inherit;font-weight:650;cursor:pointer}
.btn.s{background:var(--ac2);color:var(--ac)}.btn.d{background:none;color:var(--dg);flex:0 0 auto}
.btn.m{flex:0 0 auto;padding:7px 12px;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.msg{font-size:13px;color:var(--mu);margin-top:8px}
svg text{fill:var(--mu);font-size:11px}
@media(min-width:900px){
 #app{max-width:none;margin:0;padding-left:240px}
 #col{max-width:1080px;margin:0 auto}
 header{padding:18px 28px;font-size:22px}
 header select{max-width:300px}
 main{padding:22px 28px 90px}
 nav{top:0;bottom:auto;right:auto;width:240px;height:100%;max-width:none;margin:0;flex-direction:column;border-top:0;border-right:1px solid var(--ln);padding:22px 14px;gap:4px}
 nav .brand{display:block;font-size:21px;font-weight:700;color:var(--ac);padding:0 14px 18px}
 nav button{flex:none;display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:10px;font-size:15px}
 nav button i{display:inline;width:24px;text-align:center}
 nav button.on{background:var(--ac2)}
 nav button:hover{background:var(--ac2)}
 .grid{grid-template-columns:repeat(3,1fr);gap:14px}
 .hero{padding:24px}.hero b{font-size:56px}
 .card{padding:18px}
 .fab{right:40px;bottom:36px}
 .modal{align-items:center}
 .sheet{border-radius:16px;max-width:480px;padding:24px}
}
</style></head><body>
<div id="app"><nav id="nav"></nav>
<div id="col"><header><span id="ttl">Главная</span><select id="carsel" aria-label="Машина"></select></header><main id="main"></main></div></div>
<button class="fab" id="fab" aria-label="Добавить">+</button><div id="md"></div>
<script>
const $=s=>document.querySelector(s);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
const CATS=['Обслуживание','Ремонт','Страховка','Налог','Парковка','Мойка','Штраф','Другое'];
const TABS=[['home','⌂','Главная'],['fills','⛽','Заправки'],['costs','₴','Расходы'],['stats','▥','Статистика'],['set','⚙','Настройки']];
let tab='home',tok=null,D={};
try{D=JSON.parse(localStorage.getItem('al'))||{}}catch(e){}
D.set=D.set||{cur:'₴',cid:''};
if(!D.cars){D.cars=[{id:uid(),name:'Моя машина',u:Date.now(),fills:D.fills||[],costs:D.costs||[]}];delete D.fills;delete D.costs}
const act=a=>a.filter(x=>!x.del);
function ensure(){
  if(!act(D.cars).length)D.cars.push({id:uid(),name:'Моя машина',u:Date.now(),fills:[],costs:[]});
  if(!act(D.cars).find(c=>c.id==D.active))D.active=act(D.cars)[0].id;
}
ensure();
const C=()=>D.cars.find(c=>c.id==D.active);
const save=()=>{ensure();try{localStorage.setItem('al',JSON.stringify(D))}catch(e){}render()};
const n2=n=>(Math.round(n*100)/100).toLocaleString('ru-RU');
const money=n=>n2(n)+' '+D.set.cur;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const dfmt=d=>new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'});

function calc(){
  const car=C(),f=act(car.fills).sort((a,b)=>a.odo-b.odo),cs=act(car.costs),c={};let base=null,acc=0,tl=0,td=0;
  f.forEach(x=>{
    if(base!==null){acc+=x.liters;if(x.full){const d=x.odo-base;if(d>0){c[x.id]=acc/d*100;tl+=acc;td+=d}acc=0;base=x.odo}}
    else if(x.full){base=x.odo;acc=0}
  });
  const fuel=f.reduce((s,x)=>s+x.total,0),oth=cs.reduce((s,x)=>s+x.sum,0);
  const odos=[...f.map(x=>x.odo),...cs.map(x=>x.odo||0)].filter(Boolean);
  const dist=odos.length?Math.max(...odos)-Math.min(...odos):0;
  return{f,cs,c,avg:td?tl/td*100:null,fuel,oth,dist,last:f.length?c[f[f.length-1].id]:null,liters:f.reduce((s,x)=>s+x.liters,0)};
}

function render(){
  $('#ttl').textContent=TABS.find(t=>t[0]==tab)[2];
  const cars=act(D.cars);
  $('#carsel').innerHTML=cars.map(c=>`<option value="${c.id}" ${c.id==D.active?'selected':''}>${esc(c.name)}</option>`).join('')+'<option value="__new">＋ Добавить машину…</option>';
  $('#carsel').onchange=e=>{if(e.target.value=='__new'){e.target.value=D.active;actions.addcar()}else{D.active=e.target.value;save()}};
  $('#nav').innerHTML='<div class="brand">АвтоЖурнал</div>'+TABS.map(t=>`<button class="${t[0]==tab?'on':''}" data-t="${t[0]}"><i>${t[1]}</i>${t[2]}</button>`).join('');
  $('#nav').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;render();$('#main').scrollTop=0}};
  $('#fab').style.display=(tab=='stats'||tab=='set')?'none':'';
  $('#fab').onclick=()=>form(tab=='costs'?'c':'f');
  const s=calc();let h='';
  if(tab=='home'){
    h=`<div class="card hero"><span>Средний расход · ${esc(C().name)}</span><br><b>${s.avg?n2(s.avg):'—'}</b> <span>л/100 км</span></div>
    <div class="grid">
    <div class="card"><div class="k">Последний расход</div><div class="v">${s.last?n2(s.last)+' л/100':'—'}</div></div>
    <div class="card"><div class="k">Пробег (по записям)</div><div class="v">${n2(s.dist)} км</div></div>
    <div class="card"><div class="k">Топливо</div><div class="v">${money(s.fuel)}</div></div>
    <div class="card"><div class="k">Прочие расходы</div><div class="v">${money(s.oth)}</div></div>
    <div class="card"><div class="k">Всего потрачено</div><div class="v">${money(s.fuel+s.oth)}</div></div>
    <div class="card"><div class="k">Стоимость 1 км</div><div class="v">${s.dist?money((s.fuel+s.oth)/s.dist):'—'}</div></div></div>`;
    if(!s.f.length)h+=`<div class="empty">Добавьте первую заправку кнопкой «+».<br>Для расчёта расхода нужны две заправки «до полного бака».</div>`;
  }
  if(tab=='fills'){
    h=s.f.length?'<div class="card">'+[...s.f].reverse().map(x=>`<div class="row" data-k="f" data-id="${x.id}"><div><b>${dfmt(x.date)}</b><div class="sub">${n2(x.liters)} л × ${n2(x.price)} · ${n2(x.odo)} км${x.full?'':' · частичная'}</div></div><div class="r"><b>${money(x.total)}</b><div>${s.c[x.id]?`<span class="pill">${n2(s.c[x.id])} л/100</span>`:''}</div></div></div>`).join('')+'</div>':'<div class="empty">Заправок пока нет</div>';
  }
  if(tab=='costs'){
    const l=[...s.cs].sort((a,b)=>b.date.localeCompare(a.date));
    h=l.length?'<div class="card">'+l.map(x=>`<div class="row" data-k="c" data-id="${x.id}"><div><b>${esc(x.title||x.cat)}</b><div class="sub">${dfmt(x.date)}${x.odo?' · '+n2(x.odo)+' км':''}</div></div><div class="r"><b>${money(x.sum)}</b><div><span class="pill">${esc(x.cat)}</span></div></div></div>`).join('')+'</div>':'<div class="empty">Расходов пока нет</div>';
  }
  if(tab=='stats')h=stats(s);
  if(tab=='set')h=settings();
  $('#main').innerHTML=h;
  $('#main').onclick=e=>{const r=e.target.closest('.row[data-k]');if(r)return form(r.dataset.k,r.dataset.id);const a=e.target.closest('[data-a]');if(a)actions[a.dataset.a](a.dataset.id)};
  const cid=$('#cid');if(cid)cid.onchange=()=>{D.set.cid=cid.value.trim();save()};
  const cur=$('#cur');if(cur)cur.onchange=()=>{D.set.cur=cur.value||'₴';save()};
}

function stats(s){
  const m={};
  s.f.forEach(x=>{const k=x.date.slice(0,7);(m[k]=m[k]||{f:0,o:0}).f+=x.total});
  s.cs.forEach(x=>{const k=x.date.slice(0,7);(m[k]=m[k]||{f:0,o:0}).o+=x.sum});
  const ks=Object.keys(m).sort().slice(-6);
  if(!ks.length)return '<div class="empty">Данных для статистики пока нет</div>';
  const mx=Math.max(...ks.map(k=>m[k].f+m[k].o))||1;
  const bars=ks.map((k,i)=>{const f=m[k].f/mx*130,o=m[k].o/mx*130,x=i*100+25;
    return `<rect x="${x}" y="${150-f}" width="50" height="${f}" fill="var(--ac)" rx="3"/><rect x="${x}" y="${150-f-o}" width="50" height="${o}" fill="#e0a526" rx="3"/><text x="${x+25}" y="166" text-anchor="middle">${k.slice(5)}.${k.slice(2,4)}</text>`}).join('');
  const bc={};s.cs.forEach(x=>bc[x.cat]=(bc[x.cat]||0)+x.sum);
  return `<div class="card"><div class="k">Расходы по месяцам (зелёный — топливо, жёлтый — прочее)</div><svg viewBox="0 0 ${ks.length*100+50} 175" style="width:100%;max-height:300px">${bars}</svg></div>
  <div class="card"><div class="k">Прочие расходы по категориям</div>${Object.keys(bc).length?Object.entries(bc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row" style="cursor:default"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join(''):'<div class="sub">Нет данных</div>'}</div>
  <div class="card"><div class="k">Заправлено всего</div><div class="v">${n2(s.liters)} л</div></div>`;
}

function settings(){
  const cars=act(D.cars);
  return `<div class="card"><div class="k">Машины</div>${cars.map(c=>`<div class="row" style="cursor:default"><div><b>${esc(c.name)}</b><div class="sub">заправок ${act(c.fills).length}, расходов ${act(c.costs).length}</div></div><div class="r"><button class="btn s m" data-a="ren" data-id="${c.id}">Имя</button> ${cars.length>1?`<button class="btn s m" data-a="delcar" data-id="${c.id}">Удалить</button>`:''}</div></div>`).join('')}
  <div class="btns"><button class="btn s" data-a="addcar">＋ Добавить машину</button></div></div>
  <div class="card"><label>Валюта</label><input id="cur" value="${esc(D.set.cur)}" maxlength="4">
  <label>Google OAuth Client ID (для синхронизации)</label><input id="cid" value="${esc(D.set.cid)}" placeholder="xxxx.apps.googleusercontent.com">
  <div class="btns"><button class="btn" data-a="sync">Синхронизировать с Google Диском</button></div>
  <div class="msg" id="smsg">${D.synced?'Последняя синхронизация: '+new Date(D.synced).toLocaleString('ru-RU'):'Папки на Диске: АвтоЖурнал / название машины / файл синхронизации.'}</div></div>
  <div class="card"><div class="btns" style="margin:0"><button class="btn s" data-a="exp">Экспорт в файл</button><button class="btn s" data-a="imp">Импорт из файла</button></div></div>`;
}

function form(kind,id){
  const car=C(),arr=kind=='f'?car.fills:car.costs,x=arr.find(i=>i.id==id)||{};
  const lo=Math.max(0,...act(car.fills).map(i=>i.odo),...act(car.costs).map(i=>i.odo||0));
  let b=`<label>Дата</label><input type="date" id="f_date" value="${x.date||today()}"><label>Пробег, км</label><input type="number" inputmode="decimal" id="f_odo" value="${x.odo||(lo||'')}">`;
  if(kind=='f')b+=`<label>Литры</label><input type="number" inputmode="decimal" step="any" id="f_l" value="${x.liters||''}"><label>Цена за литр</label><input type="number" inputmode="decimal" step="any" id="f_p" value="${x.price||''}"><label>Сумма (посчитается сама, если пусто)</label><input type="number" inputmode="decimal" step="any" id="f_t" value="${x.total||''}"><div class="chk"><input type="checkbox" id="f_full" ${x.full===false?'':'checked'}><span>Заправлен до полного бака</span></div>`;
  else b+=`<label>Категория</label><select id="f_cat">${CATS.map(c=>`<option ${x.cat==c?'selected':''}>${c}</option>`).join('')}</select><label>Описание</label><input id="f_title" value="${esc(x.title)}" placeholder="Замена масла"><label>Сумма</label><input type="number" inputmode="decimal" step="any" id="f_s" value="${x.sum||''}">`;
  $('#md').innerHTML=`<div class="modal"><div class="sheet"><h3>${id?'Изменить':'Добавить'}: ${kind=='f'?'заправка':'расход'}</h3>${b}<div class="msg" id="err" style="color:var(--dg)"></div><div class="btns">${id?'<button class="btn d" id="del">Удалить</button>':''}<button class="btn s" id="no">Отмена</button><button class="btn" id="ok">Сохранить</button></div></div></div>`;
  const close=()=>$('#md').innerHTML='';
  $('#no').onclick=close;
  $('.modal').onclick=e=>{if(e.target.className=='modal')close()};
  if($('#del'))$('#del').onclick=()=>{if(confirm('Удалить запись?')){x.del=true;x.u=Date.now();close();save()}};
  $('#ok').onclick=()=>{
    const v=i=>parseFloat($(i).value.replace(',','.'))||0,o={id:x.id||uid(),date:$('#f_date').value,odo:v('#f_odo'),u:Date.now()};
    if(!o.date)return $('#err').textContent='Укажите дату';
    if(kind=='f'){
      o.liters=v('#f_l');o.price=v('#f_p');o.total=v('#f_t');o.full=$('#f_full').checked;
      if(!o.liters)return $('#err').textContent='Укажите количество литров';
      if(!o.odo)return $('#err').textContent='Укажите пробег';
      if(!o.total&&o.price)o.total=Math.round(o.liters*o.price*100)/100;
      if(!o.price&&o.total)o.price=Math.round(o.total/o.liters*100)/100;
      if(!o.total)return $('#err').textContent='Укажите цену или сумму';
    }else{
      o.cat=$('#f_cat').value;o.title=$('#f_title').value.trim();o.sum=v('#f_s');
      if(!o.sum)return $('#err').textContent='Укажите сумму';
    }
    const i=arr.findIndex(a=>a.id==o.id);i>=0?arr[i]=o:arr.push(o);close();save();
  };
}

/* ---- Слияние данных ---- */
function mergeLists(c,rem){['fills','costs'].forEach(k=>{
  const m=new Map(c[k].map(x=>[x.id,x]));
  (rem[k]||[]).forEach(x=>{const l=m.get(x.id);if(!l||(x.u||0)>(l.u||0))m.set(x.id,x)});
  c[k]=[...m.values()];
})}
function mergeCar(rem,fid){
  const r=rem.car;let c=D.cars.find(x=>x.id==r.id);
  if(!c){c={id:r.id,name:r.name,u:r.u||0,del:r.del,fills:[],costs:[]};D.cars.push(c)}
  else if((r.u||0)>(c.u||0)){c.name=r.name;c.u=r.u;c.del=r.del}
  if(fid)c.fid=fid;
  mergeLists(c,rem);
}

/* ---- Google Диск: АвтоЖурнал / машина / avtozhurnal-sync.json ---- */
const ROOT='АвтоЖурнал',FN='avtozhurnal-sync.json',FOLDER='application/vnd.google-apps.folder',G='https://www.googleapis.com/drive/v3/files';
function auth(){return new Promise((ok,fail)=>{
  if(!D.set.cid)return fail('Укажите Client ID в настройках');
  if(!window.google||!google.accounts)return fail('Скрипт Google не загрузился: нужен интернет и страница по https://');
  google.accounts.oauth2.initTokenClient({client_id:D.set.cid,scope:'https://www.googleapis.com/auth/drive.file',
    callback:r=>r.access_token?(tok=r.access_token,ok()):fail(r.error||'Доступ не выдан'),error_callback:e=>fail(e.type||'Окно входа закрыто')}).requestAccessToken();
})}
async function api(url,o={}){o.headers=Object.assign({Authorization:'Bearer '+tok},o.headers);const r=await fetch(url,o);if(!r.ok)throw new Error('Ошибка Google API: '+r.status);return r}
const J={'Content-Type':'application/json'};
const gq=async q=>(await(await api(G+'?pageSize=100&fields=files(id,name)&q='+encodeURIComponent(q))).json()).files;
const mk=async(name,parent,mime)=>(await(await api(G,{method:'POST',headers:J,body:JSON.stringify({name,mimeType:mime,parents:parent?[parent]:undefined})})).json());
async function sync(){
  const say=t=>{const m=$('#smsg');if(m)m.textContent=t};
  try{
    say('Вход в Google…');await auth();say('Синхронизация…');
    const root=(await gq(`name='${ROOT}' and mimeType='${FOLDER}' and trashed=false`))[0]||await mk(ROOT,null,FOLDER);
    const subs=await gq(`'${root.id}' in parents and mimeType='${FOLDER}' and trashed=false`),files={};
    for(const s of subs){
      const f=(await gq(`'${s.id}' in parents and name='${FN}' and trashed=false`))[0];
      if(!f)continue;files[s.id]=f.id;
      mergeCar(await(await api(`${G}/${f.id}?alt=media`)).json(),s.id);
    }
    for(const c of D.cars){
      let sub=subs.find(s=>s.id==c.fid);
      if(!sub){if(c.del)continue;sub=await mk(c.name,root.id,FOLDER);c.fid=sub.id}
      else if(!c.del&&sub.name!=c.name)await api(`${G}/${sub.id}`,{method:'PATCH',headers:J,body:JSON.stringify({name:c.name})});
      const fid=files[sub.id]||(await mk(FN,sub.id,'application/json')).id;
      await api(`https://www.googleapis.com/upload/drive/v3/files/${fid}?uploadType=media`,{method:'PATCH',headers:J,
        body:JSON.stringify({car:{id:c.id,name:c.name,u:c.u,del:c.del},fills:c.fills,costs:c.costs})});
    }
    D.synced=Date.now();save();say('Готово: данные объединены и сохранены на Диске');
  }catch(e){say('Ошибка: '+(e.message||e))}
}

const actions={
  sync,
  addcar(){const n=(prompt('Название машины (например, «Skoda Octavia»)')||'').trim();if(!n)return;const c={id:uid(),name:n,u:Date.now(),fills:[],costs:[]};D.cars.push(c);D.active=c.id;save()},
  ren(id){const c=D.cars.find(x=>x.id==id),n=(prompt('Новое название',c.name)||'').trim();if(n){c.name=n;c.u=Date.now();save()}},
  delcar(id){const c=D.cars.find(x=>x.id==id);if(confirm(`Удалить «${c.name}» со всеми записями?`)){c.del=true;c.u=Date.now();save()}},
  exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='avtozhurnal-backup.json';a.click()},
  imp(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{
    const d=JSON.parse(await i.files[0].text());
    if(d.cars)d.cars.forEach(c=>mergeCar({car:{id:c.id,name:c.name,u:c.u,del:c.del},fills:c.fills,costs:c.costs},c.fid));
    else mergeLists(C(),d);
    save()}catch(e){alert('Не удалось прочитать файл')}};i.click()}
};
render();
if('serviceWorker' in navigator&&location.protocol==='https:'||location.hostname==='localhost'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
